<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetCom | Mi cuenta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">NetCom</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>

        <li class="nav-item" id="menuCuenta">
          <a class="nav-link active" href="dashboard.html">Mi cuenta</a>
        </li>

        <li class="nav-item d-flex align-items-center ms-lg-3 my-2 my-lg-0">
          <button id="themeToggle" class="theme-toggle" type="button">
            <span class="theme-toggle-track">
              <span class="theme-icon theme-sun">☀</span>
              <span class="theme-icon theme-moon">☾</span>
              <span class="theme-toggle-thumb"></span>
            </span>
          </button>
        </li>

        <li class="nav-item" id="zonaUsuario"></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div id="contenidoCuenta"></div>
</main>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">© 2026 NetCom</p>
</footer>

<div class="modal fade" id="modalAyuda" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Ayuda NetCom</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p class="mb-0">
          La ayuda no está disponible en este momento. Esta sección queda preparada para una futura integración con soporte o centro de ayuda.
        </p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" data-bs-dismiss="modal">Entendido</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/auth.js"></script>
<script src="js/session.js"></script>
<script src="js/theme.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    cargarCuenta();
  });

  function obtenerIdUsuario(usuario) {
    return usuario.IdUsuario || usuario.idUsuario;
  }

  function enmascararCorreo(correo) {
    if (!correo || !correo.includes("@")) {
      return "Correo no disponible";
    }

    const partes = correo.split("@");
    const usuario = partes[0];
    const dominio = partes[1];

    if (usuario.length <= 2) {
      return usuario[0] + "****@" + dominio;
    }

    const visibles = usuario.substring(0, 2);
    const ocultos = "*".repeat(Math.max(usuario.length - 2, 4));

    return visibles + ocultos + "@" + dominio;
  }

  function formatearFecha(fecha) {
    if (!fecha) return "Fecha no disponible";

    return new Date(fecha).toLocaleDateString("es-CO", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
  }

  function formatoPrecioCuenta(valor) {
    return "$" + Number(valor || 0).toLocaleString("es-CO");
  }

  async function cargarCuenta() {
    const usuario = JSON.parse(localStorage.getItem("usuarioNetcom"));
    const contenedor = document.getElementById("contenidoCuenta");

    if (!usuario) {
      window.location.href = "login.html";
      return;
    }

    const rol = usuario.Rol || usuario.rol;

    if (rol === "admin") {
      window.location.href = "admin.html";
      return;
    }

    const idUsuario = obtenerIdUsuario(usuario);

    try {
      const respuesta = await fetch(`https://localhost:44301/api/venta/resumen/${idUsuario}`);

      if (!respuesta.ok) {
        throw new Error("No se pudo obtener el resumen.");
      }

      const resumen = await respuesta.json();

      pintarCuenta(resumen);

    } catch (error) {
      console.error(error);

      pintarCuenta({
        IdUsuario: idUsuario,
        NombreCompleto: `${usuario.Nombre || usuario.nombre} ${usuario.Apellido || usuario.apellido}`,
        Correo: usuario.Correo || usuario.correo,
        Rol: rol,
        FechaRegistro: usuario.FechaRegistro || usuario.fechaRegistro,
        ComprasRealizadas: 0,
        TotalComprado: 0,
        UltimaCompra: null
      });
    }
  }

  function pintarCuenta(resumen) {
    const nombre = resumen.NombreCompleto || resumen.nombreCompleto || "Usuario NetCom";
    const correo = resumen.Correo || resumen.correo || "";
    const rol = resumen.Rol || resumen.rol || "cliente";
    const fechaRegistro = resumen.FechaRegistro || resumen.fechaRegistro;
    const compras = resumen.ComprasRealizadas ?? resumen.comprasRealizadas ?? 0;
    const totalComprado = resumen.TotalComprado ?? resumen.totalComprado ?? 0;
    const ultimaCompra = resumen.UltimaCompra || resumen.ultimaCompra;

    document.getElementById("contenidoCuenta").innerHTML = `
      <section class="account-header mb-4">
        <div>
          <span class="badge bg-primary mb-2">Mi cuenta</span>
          <h1 class="fw-bold">Hola, ${nombre}</h1>
          <p class="text-muted mb-0">
            Consulta tus datos de usuario y el resumen de tus compras en NetCom.
          </p>
        </div>
      </section>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="account-card text-center">
            <div class="account-avatar">
              ${nombre.charAt(0).toUpperCase()}
            </div>

            <h4 class="fw-bold mt-3">${nombre}</h4>
            <p class="text-muted mb-1">${enmascararCorreo(correo)}</p>
            <span class="badge bg-success text-capitalize">${rol}</span>

            <hr>

            <button class="btn btn-outline-primary w-100 mb-2" data-bs-toggle="modal" data-bs-target="#modalAyuda">
              Ayuda
            </button>

            <button class="btn btn-outline-danger w-100" onclick="cerrarSesion()">
              Cerrar sesión
            </button>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="row g-4">
            <div class="col-md-6">
              <div class="account-stat-card">
                <span>Compras realizadas</span>
                <h2>${compras}</h2>
                <p class="text-muted mb-0">Compras registradas en la base de datos.</p>
              </div>
            </div>

            <div class="col-md-6">
              <div class="account-stat-card">
                <span>Total comprado</span>
                <h2>${formatoPrecioCuenta(totalComprado)}</h2>
                <p class="text-muted mb-0">Valor acumulado de compras realizadas.</p>
              </div>
            </div>

            <div class="col-md-6">
              <div class="account-stat-card">
                <span>Miembro desde</span>
                <h4>${formatearFecha(fechaRegistro)}</h4>
                <p class="text-muted mb-0">Fecha de registro en NetCom.</p>
              </div>
            </div>

            <div class="col-md-6">
              <div class="account-stat-card">
                <span>Última compra</span>
                <h4>${ultimaCompra ? formatearFecha(ultimaCompra) : "Sin compras"}</h4>
                <p class="text-muted mb-0">Última venta registrada.</p>
              </div>
            </div>
          </div>

          <div class="account-card mt-4">
            <h4 class="fw-bold">Datos de la cuenta</h4>

            <div class="table-responsive mt-3">
              <table class="table table-bordered align-middle">
                <tbody>
                  <tr>
                    <th>Nombre completo</th>
                    <td>${nombre}</td>
                  </tr>

                  <tr>
                    <th>Correo</th>
                    <td>${enmascararCorreo(correo)}</td>
                  </tr>

                  <tr>
                    <th>Tipo de cuenta</th>
                    <td class="text-capitalize">${rol}</td>
                  </tr>

                  <tr>
                    <th>Fecha de registro</th>
                    <td>${formatearFecha(fechaRegistro)}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="d-flex gap-2 flex-wrap">
              <a href="productos.html" class="btn btn-primary">Ir al catálogo</a>
              <a href="carrito.html" class="btn btn-outline-primary">Ver carrito</a>
            </div>
          </div>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
