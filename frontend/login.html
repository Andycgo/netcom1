<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetCom | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">NetCom</a>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 shadow form-card">
    <h3 class="text-center mb-4">Iniciar sesión</h3>

    <form onsubmit="loginUsuario(event)">
      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input id="loginCorreo" type="email" class="form-control" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input id="loginContrasena" type="password" class="form-control" placeholder="********" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Ingresar
      </button>
    </form>

    <div id="mensajeLogin"></div>

    <p class="text-center mt-3">
      ¿No tienes cuenta? <a href="register.html">Regístrate</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
