<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetCom | Registro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">NetCom</a>
  </div>
</nav>

<div class="container my-5">
  <div class="card p-4 shadow mx-auto form-card">
    <h3 class="text-center mb-4">Crear cuenta</h3>

    <form onsubmit="registrarUsuario(event)">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input id="nombre" class="form-control" type="text" placeholder="Nombre" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Apellido</label>
        <input id="apellido" class="form-control" type="text" placeholder="Apellido" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input id="correo" class="form-control" type="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input id="contrasena" class="form-control" type="password" placeholder="Contraseña" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input id="telefono" class="form-control" type="text" placeholder="Teléfono">
      </div>

      <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input id="direccion" class="form-control" type="text" placeholder="Dirección">
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Registrarse
      </button>
    </form>

    <div id="mensajeRegistro"></div>

    <p class="text-center mt-3">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
